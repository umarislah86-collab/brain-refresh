<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Refresh — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #e0e0f0;
    min-height: 100vh;
    padding: 32px 20px;
  }
  h1 { font-size: 1.8rem; color: #a78bfa; letter-spacing: 2px; margin-bottom: 4px; }
  .subtitle { color: #555; font-size: 0.85rem; margin-bottom: 28px; }

  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
  }
  .toolbar input {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1.5px solid #2a2a45;
    background: #12122a;
    color: #e0e0f0;
    font-size: 0.9rem;
    outline: none;
    width: 220px;
  }
  .toolbar input:focus { border-color: #a78bfa; }
  .toolbar select {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1.5px solid #2a2a45;
    background: #12122a;
    color: #e0e0f0;
    font-size: 0.9rem;
    outline: none;
  }
  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    background: #a78bfa;
    color: #0f0f1a;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #c4b5fd; }
  .btn.secondary {
    background: #1a1a2e;
    color: #a78bfa;
    border: 1.5px solid #2a2a45;
  }
  .btn.secondary:hover { border-color: #a78bfa; }

  .stats-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 16px 24px;
    min-width: 130px;
    border: 1px solid #2a2a45;
  }
  .stat-card .val { font-size: 1.8rem; font-weight: 800; color: #a78bfa; }
  .stat-card .lbl { font-size: 0.75rem; color: #555; margin-top: 2px; }

  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  thead tr { background: #1a1a2e; }
  th {
    padding: 12px 16px;
    text-align: left;
    color: #666;
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: #a78bfa; }
  th .sort-arrow { margin-left: 4px; color: #a78bfa; }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid #1a1a2e;
    color: #ccc;
    white-space: nowrap;
  }
  tr:hover td { background: #111128; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .badge.high   { background: #0d2e22; color: #34d399; }
  .badge.mid    { background: #2e2a0d; color: #fbbf24; }
  .badge.low    { background: #2e0d0d; color: #f87171; }

  .loading { text-align: center; padding: 60px; color: #555; }
  .empty   { text-align: center; padding: 60px; color: #555; }
  .error   { text-align: center; padding: 40px; color: #f87171; }

  .pagination {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
    align-items: center;
  }
  .pagination button {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1.5px solid #2a2a45;
    background: #12122a;
    color: #ccc;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .pagination button:hover { border-color: #a78bfa; color: #a78bfa; }
  .pagination button:disabled { opacity: 0.3; cursor: default; }
  .pagination .page-info { color: #555; font-size: 0.85rem; padding: 0 8px; }
</style>
</head>
<body>

<h1>BRAIN REFRESH</h1>
<div class="subtitle">Admin Dashboard — Score Records</div>

<div class="stats-row">
  <div class="stat-card"><div class="val" id="statTotal">—</div><div class="lbl">Total Attempts</div></div>
  <div class="stat-card"><div class="val" id="statUsers">—</div><div class="lbl">Unique Players</div></div>
  <div class="stat-card"><div class="val" id="statAvg">—</div><div class="lbl">Avg Score %</div></div>
  <div class="stat-card"><div class="val" id="statTop">—</div><div class="lbl">Top Score %</div></div>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search username..." oninput="applyFilters()">
  <select id="sortSelect" onchange="applyFilters()">
    <option value="timestamp_desc">Newest first</option>
    <option value="timestamp_asc">Oldest first</option>
    <option value="percentage_desc">Highest score first</option>
    <option value="percentage_asc">Lowest score first</option>
    <option value="time_asc">Fastest time first</option>
    <option value="username_asc">Username A–Z</option>
  </select>
  <button class="btn secondary" onclick="loadData()">↻ Refresh</button>
  <button class="btn secondary" onclick="exportCSV()">↓ Export CSV</button>
</div>

<div class="table-wrap">
  <div id="tableArea" class="loading">Loading scores...</div>
</div>
<div class="pagination" id="pagination" style="display:none">
  <button id="prevBtn" onclick="changePage(-1)">← Prev</button>
  <span class="page-info" id="pageInfo"></span>
  <button id="nextBtn" onclick="changePage(1)">Next →</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6TbStfWv2lE3qvQxf8WMsUJNlhVMpc_Q",
  authDomain: "brain-refresh-db364.firebaseapp.com",
  projectId: "brain-refresh-db364",
  storageBucket: "brain-refresh-db364.firebasestorage.app",
  messagingSenderId: "179174675906",
  appId: "1:179174675906:web:0d3bfb01216a1e78e8b25b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const PAGE_SIZE = 20;
let allRecords = [];
let filtered = [];
let currentPage = 1;

window.loadData = async function() {
  document.getElementById('tableArea').innerHTML = '<div class="loading">Loading scores...</div>';
  document.getElementById('pagination').style.display = 'none';
  try {
    const q = query(collection(db, "scores"), orderBy("timestamp", "desc"));
    const snap = await getDocs(q);
    allRecords = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    updateStats();
    applyFilters();
  } catch (e) {
    document.getElementById('tableArea').innerHTML =
      `<div class="error">Failed to load data.<br><small>${e.message}</small></div>`;
  }
};

function updateStats() {
  document.getElementById('statTotal').textContent = allRecords.length;
  const users = new Set(allRecords.map(r => r.username?.toLowerCase())).size;
  document.getElementById('statUsers').textContent = users;
  if (allRecords.length > 0) {
    const avg = allRecords.reduce((s, r) => s + (r.percentage || 0), 0) / allRecords.length;
    document.getElementById('statAvg').textContent = Math.round(avg) + '%';
    const top = Math.max(...allRecords.map(r => r.percentage || 0));
    document.getElementById('statTop').textContent = top + '%';
  }
}

window.applyFilters = function() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  filtered = allRecords.filter(r =>
    !search || (r.username || '').toLowerCase().includes(search)
  );

  filtered.sort((a, b) => {
    if (sort === 'timestamp_desc') return (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0);
    if (sort === 'timestamp_asc')  return (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0);
    if (sort === 'percentage_desc') return (b.percentage || 0) - (a.percentage || 0);
    if (sort === 'percentage_asc')  return (a.percentage || 0) - (b.percentage || 0);
    if (sort === 'username_asc') return (a.username||'').localeCompare(b.username||'');
    if (sort === 'time_asc') return (a.timeTaken || 999) - (b.timeTaken || 999);
    return 0;
  });

  currentPage = 1;
  renderTable();
};

function renderTable() {
  if (filtered.length === 0) {
    document.getElementById('tableArea').innerHTML = '<div class="empty">No records found.</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageData = filtered.slice(start, start + PAGE_SIZE);

  let html = `<table>
    <thead><tr>
      <th>#</th>
      <th onclick="sortBy('username_asc')">Username</th>
      <th onclick="sortBy('percentage_desc')">Score</th>
      <th>Result</th>
      <th onclick="sortBy('time_asc')">Time Taken</th>
      <th>Questions</th>
      <th onclick="sortBy('timestamp_desc')">Date & Time</th>
    </tr></thead><tbody>`;

  pageData.forEach((r, i) => {
    const rank = start + i + 1;
    const pct = r.percentage ?? Math.round((r.score / r.total) * 100);
    const badgeClass = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';
    const dt = r.timestamp?.toDate ? r.timestamp.toDate().toLocaleString() : '—';
    const t = r.timeTaken;
    const timeStr = t ? (Math.floor(t/60) > 0 ? `${Math.floor(t/60)}m ${t%60}s` : `${t}s`) : '—';
    html += `<tr>
      <td style="color:#444">${rank}</td>
      <td style="color:#f0f0ff;font-weight:600">${esc(r.username || '—')}</td>
      <td><strong style="color:#e0e0f0">${r.score ?? '?'}/${r.total ?? '?'}</strong></td>
      <td><span class="badge ${badgeClass}">${pct}%</span></td>
      <td style="color:#a78bfa;font-weight:600">${timeStr}</td>
      <td style="color:#666">${r.total ?? '?'}</td>
      <td style="color:#555">${dt}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tableArea').innerHTML = html;

  // Pagination
  document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
  document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${filtered.length} records)`;
  document.getElementById('prevBtn').disabled = currentPage === 1;
  document.getElementById('nextBtn').disabled = currentPage === totalPages;
}

window.changePage = function(dir) {
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
  renderTable();
  window.scrollTo(0, 0);
};

window.sortBy = function(val) {
  document.getElementById('sortSelect').value = val;
  applyFilters();
};

window.exportCSV = function() {
  if (!filtered.length) return;
  const rows = [['#', 'Username', 'Score', 'Total', 'Percentage', 'Categories', 'Timestamp']];
  filtered.forEach((r, i) => {
    const dt = r.timestamp?.toDate ? r.timestamp.toDate().toISOString() : '';
    rows.push([i+1, r.username||'', r.score??'', r.total??'', (r.percentage??'')+'%', r.categories||'', dt]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `brain-refresh-scores-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Auto-load on open
loadData();
</script>
</body>
</html>
